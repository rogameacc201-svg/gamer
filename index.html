<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SFC 遊戲大廳</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 50px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 10px; display: inline-block; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        select, input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; box-sizing: border-box; }
        button { background: #6200ee; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #3700b3; }
        .join-btn { background: #03dac6; color: #000; }
        .join-btn:hover { background: #018786; color: #fff; }
    </style>
</head>
<body>

    <div class="box">
        <h2>SFC 遊戲大廳</h2>
        
        <!-- 選擇遊戲 -->
        <label>選擇遊戲：</label>
        <select id="gameSelect">
            <option value="super_tetris_3.smc">超級俄羅斯方塊 3</option>
            <option value="contra.sfc">魂斗羅 3 (Contra III)</option>
        </select>

        <!-- 建立房間 -->
        <button onclick="createRoom()">建立房間 (開房者)</button>

        <hr style="border-color: #333; margin: 20px 0;">

        <!-- 加入房間 -->
        <input type="text" id="roomInput" placeholder="請輸入房號 (例如: abc12345)">
        <button class="join-btn" onclick="joinRoom()">加入房間</button>
    </div>

    <script>
        function createRoom() {
            const game = document.getElementById('gameSelect').value;
            // 產生隨機 6 位數房號
            const roomId = Math.random().toString(36).substring(2, 8);
            // 透過網址參數帶入房間與遊戲資訊
            window.location.href = `room.html?room=${roomId}&game=${game}`;
        }

        function joinRoom() {
            const roomId = document.getElementById('roomInput').value.trim();
            if (!roomId) {
                alert('請輸入房號！');
                return;
            }
            // 加入時直接導向該房間 (遊戲會依據網址的 game 參數或預設載入)
            window.location.href = `room.html?room=${roomId}`;
        }
    </script>
</body>
</html>
