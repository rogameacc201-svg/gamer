<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SFC 網頁對戰大廳</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 50px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 10px; display: inline-block; width: 400px; }
        select, input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        button { background: #6200ee; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #3700b3; }
    </style>
</head>
<body>

    <div class="box">
        <h2>SFC 網路對戰大廳</h2>
        
        <!-- 選擇遊戲 -->
        <label>選擇遊戲：</label>
        <select id="gameSelect">
            <option value="mario.sfc">超級瑪利歐世界 (Super Mario World)</option>
            <option value="contra.sfc">魂斗羅 3 (Contra III)</option>
            <option value="streetfighter.sfc">快打旋風 2 (Street Fighter II)</option>
        </select>

        <!-- 模式一：建立房間 -->
        <button onclick="createRoom()">建立新房間 (我是 1P 房主)</button>

        <hr style="border-color: #333; margin: 20px 0;">

        <!-- 模式二：加入房間 -->
        <input type="text" id="roomInput" placeholder="請輸入房主提供的房號">
        <button style="background: #03dac6; color: #000;" onclick="joinRoom()">加入房間 (2-4P)</button>
    </div>

    <script>
        function createRoom() {
            const selectedGame = document.getElementById('gameSelect').value;
            // 產生隨機房號
            const roomId = Math.random().toString(36).substring(2, 8);
            // 跳轉至房間頁面，帶入模式=host與遊戲名稱
            window.location.href = `room.html?room=${roomId}&mode=host&game=${selectedGame}`;
        }

        function joinRoom() {
            const roomId = document.getElementById('roomInput').value.trim();
            if (!roomId) {
                alert('請輸入有效的房號！');
                return;
            }
            // 跳轉至房間頁面，帶入模式=client
            window.location.href = `room.html?room=${roomId}&mode=client`;
        }
    </script>
</body>
</html>
