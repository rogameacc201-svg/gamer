<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SFC 網頁雙人對戰大廳</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 50px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 10px; display: inline-block; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        select, input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; box-sizing: border-box; }
        button { background: #6200ee; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #3700b3; }
        .join-btn { background: #03dac6; color: #000; }
        .join-btn:hover { background: #018786; color: #fff; }
    </style>
</head>
<body>

    <div class="box">
        <h2>SFC 雲端零成本雙人對戰</h2>
        
        <label>選擇遊戲：</label>
        <select id="gameSelect">
            <option value="super_tetris_3.smc">超級俄羅斯方塊 3 (Super Tetris 3)</option>
        </select>

        <button onclick="createRoom()">建立新房間 (成為 1P)</button>

        <hr style="border-color: #333; margin: 20px 0;">

        <input type="text" id="roomInput" placeholder="請輸入房號">
        <button class="join-btn" onclick="joinRoom()">加入房間 (成為 2P)</button>
    </div>

    <script>
        function createRoom() {
            const game = document.getElementById('gameSelect').value;
            const roomId = Math.random().toString(36).substring(2, 8); // 產生隨機 6 碼房號
            window.location.href = `room.html?room=${roomId}&mode=host&game=${game}`;
        }

        function joinRoom() {
            const roomId = document.getElementById('roomInput').value.trim();
            if (!roomId) {
                alert('請輸入房號！');
                return;
            }
            window.location.href = `room.html?room=${roomId}&mode=client`;
        }
    </script>
</body>
</html>
