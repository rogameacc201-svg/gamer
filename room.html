<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SFC 遊戲房間</title>
    <style>
        body { background: #000; color: #fff; text-align: center; margin: 0; padding: 20px; font-family: sans-serif; }
        #info { margin-bottom: 15px; color: #03dac6; font-size: 16px; font-weight: bold; }
        #game-container { width: 640px; height: 480px; margin: 0 auto; background: #111; border: 2px solid #333; }
        .back-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #333; color: #fff; text-decoration: none; border-radius: 5px; }
        .back-btn:hover { background: #555; }
    </style>
</head>
<body>

    <div id="info">正在載入房間：<span id="roomDisplay"></span> | 遊戲：<span id="gameDisplay"></span></div>

    <!-- 模擬器掛載容器 -->
    <div id="game-container"></div>

    <br>
    <a href="index.html" class="back-btn">返回大廳</a>

    <script>
        // 解析網址參數
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || '未知房號';
        const gameFile = urlParams.get('game') || 'mario.sfc'; // 如果是加入者沒帶 game，預設帶入或讓其選擇

        document.getElementById('roomDisplay').innerText = roomId;
        document.getElementById('gameDisplay').innerText = gameFile;

        // 設定並啟動 EmulatorJS
        window.EJS_player = '#game-container';
        window.EJS_gameUrl = `roms/${gameFile}`; // 確保你的專案根目錄下有 roms 資料夾並放好對應的 .sfc 檔
        window.EJS_core = 'snes';
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        // 動態載入模擬器主程式
        const script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        document.body.appendChild(script);
    </script>
</body>
</html>
