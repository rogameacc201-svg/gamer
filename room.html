<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SFC 遊戲對戰房間</title>
    <!-- 引入 PeerJS 用於 P2P 網路對戰 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #fff; text-align: center; margin: 0; padding: 20px; font-family: sans-serif; }
        #info { margin-bottom: 10px; color: #03dac6; font-size: 16px; font-weight: bold; }
        #status { margin-bottom: 15px; color: #ffeb3b; font-size: 14px; }
        #game-container { width: 640px; height: 480px; margin: 0 auto; background: #111; border: 2px solid #333; }
        .back-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #333; color: #fff; text-decoration: none; border-radius: 5px; }
        .back-btn:hover { background: #555; }
    </style>
</head>
<body>

    <div id="info">房間代碼：<span id="roomDisplay"></span> | 身分：<span id="roleDisplay"></span></div>
    <div id="status">正在初始化 P2P 網路與模擬器...</div>

    <!-- 模擬器掛載容器 -->
    <div id="game-container"></div>

    <br>
    <a href="index.html" class="back-btn">返回大廳</a>

    <script>
        // 解析網址參數
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'test';
        const gameFile = urlParams.get('game') || 'super_tetris_3.smc';
        const mode = urlParams.get('mode') || 'host';

        document.getElementById('roomDisplay').innerText = roomId;
        document.getElementById('roleDisplay').innerText = (mode === 'host') ? '房主 (1P)' : '參戰玩家 (2-4P)';

        let peer;
        let connectedConnection = null;

        // 設定免費的公開 STUN 伺服器，增強連線穩定度
        const peerConfig = {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        };

        if (mode === 'host') {
            // 【房主模式】使用固定房號建立 Peer
            peer = new Peer('sfc-room-' + roomId, peerConfig);

            peer.on('open', (id) => {
                document.getElementById('status').innerText = `房間建立成功！請將本頁網址或房號「 ${roomId} 」分享給朋友。`;
                loadEmulator(`roms/${gameFile}`);
            });

            peer.on('error', (err) => {
                console.error(err);
                if (err.type === 'unavailable-id') {
                    document.getElementById('status').innerText = `此房號已被使用，請返回大廳重新建立。`;
                } else {
                    document.getElementById('status').innerText = `連線錯誤: ${err.type}`;
                }
            });

            // 監聽有沒有其他玩家連入
            peer.on('connection', (conn) => {
                connectedConnection = conn;
                document.getElementById('status').innerText = `有新玩家成功連線加入！`;

                conn.on('data', (data) => {
                    console.log("收到遠端玩家按鍵資料：", data);
                    // 之後可在此處將按鍵對應到模擬器的控制器輸入
                });

                conn.on('close', () => {
                    document.getElementById('status').innerText = `玩家已斷開連線。`;
                });
            });

        } else {
            // 【加入者模式】隨機產生自己的身分，並主動連線到房主的 ID
            peer = new Peer(peerConfig);

            peer.on('open', (id) => {
                document.getElementById('status').innerText = `正在連線至房主房間 (${roomId})...`;
                const conn = peer.connect('sfc-room-' + roomId);

                conn.on('open', () => {
                    connectedConnection = conn;
                    document.getElementById('status').innerText = `已成功連線到房主！開始載入遊戲。`;
                    loadEmulator(`roms/${gameFile}`);

                    // 範例：將自己的按鍵傳送給房主
                    window.addEventListener('keydown', (e) => {
                        conn.send({ type: 'keydown', key: e.key });
                    });
                });

                conn.on('error', (err) => {
                    document.getElementById('status').innerText = `無法連線到房主，請確認房號是否正確或房主尚未開房。`;
                });
            });
        }

        // 載入 EmulatorJS 模擬器核心
        function loadEmulator(romUrl) {
            window.EJS_player = '#game-container';
            window.EJS_gameUrl = romUrl;
            window.EJS_core = 'snes';
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            
            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
