<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SFC 遊戲對戰房間</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #fff; text-align: center; margin: 0; padding: 20px; font-family: sans-serif; }
        #status { margin-bottom: 10px; color: #03dac6; font-size: 14px; }
        #canvas-container { display: inline-block; position: relative; border: 2px solid #333; }
        canvas { background: #111; display: block; width: 512px; height: 448px; }
    </style>
</head>
<body>

    <h2>SFC 房間：<span id="roomDisplay"></span> (<span id="roleDisplay"></span>)</h2>
    <div id="status">正在建立連線...</div>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="512" height="448"></canvas>
    </div>

    <script>
        // 解析網址參數
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const mode = urlParams.get('mode'); // 'host' 或 'client'
        const game = urlParams.get('game');

        document.getElementById('roomDisplay').innerText = roomId;
        document.getElementById('roleDisplay').innerText = (mode === 'host') ? '房主 (1P)' : '參戰玩家 (2-4P)';

        let peer;
        let connections = []; // 儲存連線到房主的玩家

        if (mode === 'host') {
            // 【房主模式】使用房號作為 Peer ID
            peer = new Peer('sfc-room-' + roomId);
            
            peer.on('open', (id) => {
                document.getElementById('status').innerText = `房間建立成功！請將房號「 ${roomId} 」分享給其他人。`;
                // 房主載入遊戲核心與 ROM
                initEmulator(game, true);
            });

            // 監聽其他玩家加入
            peer.on('connection', (conn) => {
                connections.push(conn);
                document.getElementById('status').innerText = `有新玩家加入！目前連線人數：${connections.length + 1} 人`;

                conn.on('data', (data) => {
                    // 收到其他玩家傳來的控制器按鍵，轉發給模擬器
                    console.log("收到遠端玩家按鍵：", data);
                });
            });

        } else {
            // 【加入者模式】隨機產生自己的 ID 並連線到房主
            peer = new Peer();

            peer.on('open', (id) => {
                document.getElementById('status').innerText = `正在連接房主 (${roomId})...`;
                const conn = peer.connect('sfc-room-' + roomId);

                conn.on('open', () => {
                    document.getElementById('status').innerText = `已成功加入房間！可以開始遊玩。`;
                    initEmulator(null, false);

                    // 範例：傳送按鍵給房主
                    window.addEventListener('keydown', (e) => {
                        conn.send({ type: 'keydown', key: e.key });
                    });
                });
            });
        }

        function initEmulator(gameFile, isHost) {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // 畫面提示文字
            ctx.fillStyle = "#fff";
            ctx.font = "20px sans-serif";
            ctx.fillText(isHost ? `[Host] 正在執行: ${gameFile}` : "[Client] 等待房主畫面同步...", 50, 220);

            // 提示：此處可整合 EmulatorJS 或對應的 SFC Wasm 模擬器核心初始化
            // 房主負責跑遊戲迴圈，Client 負責接收畫面與發送按鍵
        }
    </script>
</body>
</html>
