<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SFC WebSocket 雙人對戰房間</title>
    <style>
        body { background: #000; color: #fff; text-align: center; margin: 0; padding: 20px; font-family: sans-serif; }
        #info { margin-bottom: 10px; color: #03dac6; font-size: 15px; font-weight: bold; }
        #status { margin-bottom: 15px; color: #ffeb3b; font-size: 14px; }
        #game-container { width: 512px; height: 448px; margin: 0 auto; background: #111; border: 2px solid #333; display: flex; justify-content: center; align-items: center; }
        canvas { image-rendering: pixelated; width: 100%; height: 100%; }
        .back-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #333; color: #fff; text-decoration: none; border-radius: 5px; }
        .back-btn:hover { background: #555; }
    </style>
</head>
<body>

    <div id="info">房間：<span id="roomDisplay"></span> | 您的身分：<span id="roleDisplay"></span></div>
    <div id="status">正在連線至 WebSocket 信令伺服器...</div>

    <div id="game-container">
        <canvas id="emulatorCanvas" width="256" height="224"></canvas>
    </div>

    <br>
    <a href="index.html" class="back-btn">返回大廳</a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'test';
        const mode = urlParams.get('mode') || 'host';

        document.getElementById('roomDisplay').innerText = roomId;
        document.getElementById('roleDisplay').innerText = (mode === 'host') ? '1P 房主' : '2P 玩家';

        // 連結你的 WebSocket 伺服器 (若部署上雲端，換成對應的 wss:// 網址)
        const wsUrl = 'ws://localhost:3000';
        const ws = new WebSocket(wsUrl);

        let isConnected = false;

        ws.onopen = () => {
            document.getElementById('status').innerText = `已連線至信令伺服器，正在註冊房間...`;
            
            if (mode === 'host') {
                ws.send(JSON.stringify({ type: 'create_room', roomId: roomId }));
            } else {
                ws.send(JSON.stringify({ type: 'join_room', roomId: roomId }));
            }
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.status === 'room_created') {
                document.getElementById('status').innerText = `房間建立成功！等待 2P 加入中...`;
            } else if (data.status === 'joined_success') {
                document.getElementById('status').innerText = `成功加入房間！已與房主建立同步通道。`;
                isConnected = true;
            } else if (data.status === 'room_not_found') {
                document.getElementById('status').innerText = `錯誤：找不到此房號，請確認房號是否正確。`;
            } else if (data.type === 'client_joined') {
                document.getElementById('status').innerText = `2P 玩家已連線加入！雙人對戰就緒。`;
                isConnected = true;
            } else if (data.type === 'signal') {
                // 收到對方透過伺服器轉發的按鍵訊號
                handleRemoteInput(data.payload);
            }
        };

        ws.onerror = (err) => {
            document.getElementById('status').innerText = `WebSocket 連線錯誤，請確認伺服器是否啟動。`;
            console.error(err);
        };

        // 監聽本機鍵盤輸入並透過 WebSocket 傳送
        window.addEventListener('keydown', (e) => {
            if (!isConnected) return;
            const payload = { player: (mode === 'host' ? 1 : 2), action: 'keydown', code: e.code };
            
            // 執行本地對應
            processInput(payload);

            // 傳送給對方
            ws.send(JSON.stringify({ type: 'forward_signal', roomId: roomId, payload: payload }));
        });

        window.addEventListener('keyup', (e) => {
            if (!isConnected) return;
            const payload = { player: (mode === 'host' ? 1 : 2), action: 'keyup', code: e.code };
            
            processInput(payload);
            ws.send(JSON.stringify({ type: 'forward_signal', roomId: roomId, payload: payload }));
        });

        function processInput(data) {
            console.log(`收到按鍵 - 玩家 ${data.player}: ${data.action} (${data.code})`);
        }

        function handleRemoteInput(payload) {
            console.log(`收到遠端玩家動作 ->`, payload);
            // 這裡未來會直接輸入到你的模擬器核心控制器中
        }
    </script>
</body>
</html>
