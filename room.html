<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SFC 雙人對戰房間</title>
    <style>
        body { background: #000; color: #fff; text-align: center; margin: 0; padding: 20px; font-family: sans-serif; }
        #info { margin-bottom: 10px; color: #03dac6; font-size: 15px; font-weight: bold; }
        #status { margin-bottom: 15px; color: #ffeb3b; font-size: 14px; }
        #game-container { width: 512px; height: 448px; margin: 0 auto; background: #111; border: 2px solid #333; display: flex; justify-content: center; align-items: center; }
        canvas { image-rendering: pixelated; width: 100%; height: 100%; }
        .back-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #333; color: #fff; text-decoration: none; border-radius: 5px; }
        .back-btn:hover { background: #555; }
        .controls-tip { color: #aaa; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="info">房間：<span id="roomDisplay"></span> | 您的身分：<span id="roleDisplay"></span></div>
    <div id="status">正在連線至雲端信令通道...</div>

    <div id="game-container">
        <canvas id="emulatorCanvas" width="256" height="224"></canvas>
    </div>

    <div class="controls-tip">
        操作提示：按下鍵盤方向鍵或按鈕，會在 F12 主控台即時同步互傳。
    </div>

    <br>
    <a href="index.html" class="back-btn">返回大廳</a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'test';
        const mode = urlParams.get('mode') || 'host';

        document.getElementById('roomDisplay').innerText = roomId;
        document.getElementById('roleDisplay').innerText = (mode === 'host') ? '1P 房主' : '2P 玩家';

        // 使用免費公開的 WebSocket 測試通道
        const ws = new WebSocket('wss://socketsbay.com/wss/v2/1/demo/');

        let isConnected = false;

        ws.onopen = () => {
            document.getElementById('status').innerText = `已連線至雲端通道，正在廣播房間狀態...`;
            
            // 發送加入或建立房號的識別訊息
            ws.send(JSON.stringify({
                type: 'JOIN_ROOM',
                roomId: roomId,
                role: mode
            }));
            
            isConnected = true;
            document.getElementById('status').innerText = `雙人同步通道已就緒！ (${mode === 'host' ? '1P' : '2P'})`;
        };

        ws.onmessage = (event) => {
            try {
                // 有時公開測試伺服器會收到其他人的雜訊，必須用 roomId 過濾
                const data = JSON.parse(event.data);
                
                if (data.roomId === roomId && data.sender !== getClientId()) {
                    if (data.type === 'INPUT_SYNC') {
                        handleRemoteInput(data.payload);
                    }
                }
            } catch (e) {
                // 忽略解析失敗的無關字串
            }
        };

        ws.onerror = (err) => {
            document.getElementById('status').innerText = `通道連線發生錯誤。`;
            console.error(err);
        };

        // 產生一個隨機的使用者分頁 ID 避免收到自己的訊息
        const clientId = Math.random().toString(36).substring(2, 10);
        function getClientId() { return clientId; }

        // 監聽本機鍵盤輸入
        window.addEventListener('keydown', (e) => {
            if (!isConnected) return;
            const payload = { player: (mode === 'host' ? 1 : 2), action: 'keydown', code: e.code };
            
            processInput(payload);
            sendSignal(payload);
        });

        window.addEventListener('keyup', (e) => {
            if (!isConnected) return;
            const payload = { player: (mode === 'host' ? 1 : 2), action: 'keyup', code: e.code };
            
            processInput(payload);
            sendSignal(payload);
        });

        function sendSignal(payload) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    roomId: roomId,
                    sender: getClientId(),
                    type: 'INPUT_SYNC',
                    payload: payload
                }));
            }
        }

        function processInput(data) {
            console.log(`[本地動作] 玩家 ${data.player}: ${data.action} (${data.code})`);
        }

        function handleRemoteInput(payload) {
            console.log(`[收到遠端對手動作] 玩家 ${payload.player}: ${payload.action} (${payload.code})`);
            // 這裡未來可以直接對應到 SFC 模擬器的控制器輸入
        }
    </script>
</body>
</html>
